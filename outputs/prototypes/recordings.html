<!doctype html>
<meta charset="utf-8">
<title>Recordings — prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/design-tokens.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--ink);
    font-family:var(--font-body);
    font-size:14px;line-height:1.45;
    -webkit-font-smoothing:antialiased;
    padding:0 0 80px;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:0 28px}

  /* ---------- instrument header ---------- */
  .masthead{padding:34px 0 0}
  .eyebrow{
    font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted);
  }
  .masthead h1{
    font-family:var(--font-display);font-weight:800;font-size:34px;
    letter-spacing:-.02em;margin:6px 0 0;
  }
  /* telemetry strip: numbers align because they are tabular */
  .telemetry{
    display:flex;gap:0;margin:20px 0 0;
    border-top:1px solid var(--ink);border-bottom:1px solid var(--line);
  }
  .telemetry div{
    flex:1;padding:11px 0 12px;
    border-right:1px solid var(--line);
  }
  .telemetry div:last-child{border-right:0}
  .t-num{
    font-family:var(--font-mono);font-variant-numeric:tabular-nums;
    font-size:22px;font-weight:500;letter-spacing:-.01em;
  }
  .t-lab{
    font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);margin-top:3px;
  }

  /* ---------- controls: no pills, no rounded chips ---------- */
  .controls{display:flex;align-items:flex-end;gap:26px;margin:26px 0 0;flex-wrap:wrap}
  .field{flex:1;min-width:260px}
  .field label{
    display:block;font-family:var(--font-mono);font-size:10px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;
  }
  #q{
    width:100%;background:transparent;color:var(--ink);
    font-family:var(--font-mono);font-size:15px;
    border:0;border-bottom:1.5px solid var(--ink);
    padding:5px 0 7px;outline:none;
  }
  #q::placeholder{color:var(--muted);opacity:.7}
  #q:focus{border-bottom-color:var(--repro)}

  .toggles{display:flex;gap:18px}
  .tg{
    background:none;border:0;cursor:pointer;color:var(--muted);
    font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;padding:5px 0 7px;
    border-bottom:1.5px solid transparent;
  }
  .tg[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}

  /* ---------- block section ---------- */
  .block{margin-top:38px}
  .block-head{
    display:flex;align-items:baseline;gap:14px;
    padding-bottom:8px;border-bottom:1px solid var(--ink);
    position:sticky;top:0;background:var(--bg);z-index:2;
  }
  .block-rule{width:26px;height:3px;background:var(--c);flex:none;align-self:center}
  .block-head h2{
    font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:-.01em;
  }
  .block-meta{
    margin-left:auto;font-family:var(--font-mono);font-variant-numeric:tabular-nums;
    font-size:11px;letter-spacing:.06em;color:var(--muted);white-space:nowrap;
  }

  .sub{
    font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted);
    padding:16px 0 5px 40px;
  }

  /* ---------- the row: spine, not a card ---------- */
  .row{
    display:flex;align-items:center;gap:14px;
    padding:9px 0 9px 14px;
    border-bottom:1px solid var(--line);
    border-left:3px solid var(--c);
    cursor:pointer;
    transition:background .12s ease;
  }
  .row:hover{background:var(--c-tint)}
  .row.done .r-title{color:var(--muted)}
  .r-check{
    flex:none;width:15px;height:15px;border:1.5px solid var(--line-strong,var(--muted));
    display:grid;place-items:center;
  }
  .row.done .r-check{background:var(--c);border-color:var(--c)}
  .r-check svg{width:9px;height:9px;stroke:#fff;stroke-width:3;fill:none;visibility:hidden}
  .row.done .r-check svg{visibility:visible}
  .r-date{
    flex:none;width:74px;
    font-family:var(--font-mono);font-variant-numeric:tabular-nums;
    font-size:12px;color:var(--muted);
  }
  .r-title{flex:1;font-size:14px;line-height:1.35}
  .r-tag{
    flex:none;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--c-deep);
    border:1px solid var(--c-soft);padding:2px 5px;
  }
  .r-n{
    flex:none;width:34px;text-align:right;
    font-family:var(--font-mono);font-variant-numeric:tabular-nums;
    font-size:11px;color:var(--muted);
  }

  mark{background:var(--repro-soft);color:inherit;padding:0 1px}
  .empty{padding:44px 0;color:var(--muted);font-family:var(--font-mono);font-size:13px}
  .hidden{display:none}
  @media (max-width:640px){
    .r-date{width:56px;font-size:11px}
    .r-tag{display:none}
    .telemetry{flex-wrap:wrap}
    .telemetry div{flex:1 0 50%;border-bottom:1px solid var(--line)}
  }
</style>

<div class="wrap">
  <div class="masthead">
    <div class="eyebrow">USMLE Step 1 · Cohort 2026</div>
    <h1>Recordings</h1>
    <div class="telemetry">
      <div><div class="t-num" id="tTotal">—</div><div class="t-lab">Classes</div></div>
      <div><div class="t-num" id="tBlocks">—</div><div class="t-lab">Systems</div></div>
      <div><div class="t-num" id="tQ">—</div><div class="t-lab">Question sessions</div></div>
      <div><div class="t-num" id="tSpan">—</div><div class="t-lab">Days covered</div></div>
      <div><div class="t-num" id="tDone">—</div><div class="t-lab">Watched</div></div>
    </div>

    <div class="controls">
      <div class="field">
        <label for="q">Search all recordings</label>
        <input id="q" type="search" placeholder="lineweaver, torsion, nephritic, tamoxifen…" autocomplete="off">
      </div>
      <div class="toggles">
        <button class="tg" id="fq" aria-pressed="false">Question sessions</button>
        <button class="tg" id="fu" aria-pressed="false">Unwatched</button>
      </div>
    </div>
  </div>

  <div id="list"></div>
  <div class="empty hidden" id="empty">No recording matches that.</div>
</div>

<script>
const KEY = 'usmle.proto.watched';
let watched = new Set(JSON.parse(localStorage.getItem(KEY) || '[]'));
let BLOCKS = [], FLAT = [];
let qStr = '', onlyQ = false, onlyUnwatched = false;

const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt = d => { if (!d) return '\u2014'; const [y,m,dd] = d.split('-'); return dd + ' ' +
  ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]; };

function hi(text, q){
  const safe = esc(text);
  if (!q) return safe;
  const i = safe.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return safe;
  return safe.slice(0,i) + '<mark>' + safe.slice(i, i+q.length) + '</mark>' + safe.slice(i+q.length);
}

function render(){
  const list = document.getElementById('list');
  list.innerHTML = '';
  let shown = 0, idx = 0;

  BLOCKS.forEach(b => {
    const rows = [];
    b.subBlocks.forEach(sb => {
      sb.recordings.forEach(r => {
        idx++;
        const isQ = /question/i.test(r.title);
        const done = watched.has(r.url);
        if (qStr && !r.title.toLowerCase().includes(qStr.toLowerCase())) return;
        if (onlyQ && !isQ) return;
        if (onlyUnwatched && done) return;
        rows.push({r, sb, isQ, done, n: idx});
      });
    });
    if (!rows.length) return;
    shown += rows.length;

    const sec = document.createElement('section');
    sec.className = 'block subject-' + b.subject;
    const bDone = rows.filter(x => x.done).length;

    let html = '<div class="block-head"><span class="block-rule"></span><h2>' +
      esc(b.label) + '</h2><span class="block-meta">' + rows.length + ' classes · ' +
      esc(b.dateRange) + ' · ' + bDone + '/' + rows.length + ' watched</span></div>';

    let lastSub = null;
    rows.forEach(({r, sb, isQ, done, n}) => {
      if (sb.label !== lastSub){ html += '<div class="sub">' + esc(sb.label) + '</div>'; lastSub = sb.label; }
      html += '<div class="row' + (done ? ' done' : '') + '" data-url="' + esc(r.url) + '">' +
        '<span class="r-check"><svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg></span>' +
        '<span class="r-date">' + fmt(r.date) + '</span>' +
        '<span class="r-title">' + hi(r.title, qStr) + '</span>' +
        (isQ ? '<span class="r-tag">Questions</span>' : '') +
        '<span class="r-n">' + n + '</span>' +
      '</div>';
    });
    sec.innerHTML = html;
    list.appendChild(sec);
  });

  document.getElementById('empty').classList.toggle('hidden', shown > 0);
  document.getElementById('tDone').textContent = watched.size;
}

function stats(){
  let n = 0, q = 0, min = '9999', max = '0000';
  BLOCKS.forEach(b => b.subBlocks.forEach(s => s.recordings.forEach(r => {
    n++; if (/question/i.test(r.title)) q++;
    const d = r.date || b.start;
    if (d && d < min) min = d; if (d && d > max) max = d;
  })));
  const days = Math.round((new Date(max) - new Date(min)) / 86400000) + 1;
  document.getElementById('tTotal').textContent = n;
  document.getElementById('tBlocks').textContent = BLOCKS.length;
  document.getElementById('tQ').textContent = q;
  document.getElementById('tSpan').textContent = days;
}

document.addEventListener('click', e => {
  const row = e.target.closest('.row');
  if (!row) return;
  const url = row.dataset.url;
  if (watched.has(url)) watched.delete(url); else watched.add(url);
  localStorage.setItem(KEY, JSON.stringify([...watched]));
  render();
});
document.getElementById('q').addEventListener('input', e => { qStr = e.target.value.trim(); render(); });
document.getElementById('fq').addEventListener('click', e => {
  onlyQ = !onlyQ; e.currentTarget.setAttribute('aria-pressed', onlyQ); render();
});
document.getElementById('fu').addEventListener('click', e => {
  onlyUnwatched = !onlyUnwatched; e.currentTarget.setAttribute('aria-pressed', onlyUnwatched); render();
});

fetch('blocks.json').then(r => r.json()).then(d => { BLOCKS = d; stats(); render(); });
</script>
