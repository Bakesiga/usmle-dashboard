<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register for the January 2027 cohort</title>
<!-- A redirect, not a page. The flyer and the QR point here instead of at
     the form's own short link, for two reasons: a reader can type this
     without getting a case-sensitive token wrong, and if the form is ever
     replaced the printed flyers keep working, because only this line
     changes. Keep the target on one line, below, so it is easy to swap. -->
<link rel="canonical" href="https://forms.gle/V3YRGfmHTh7gVrb7A">
<meta http-equiv="refresh" content="0; url=https://forms.gle/V3YRGfmHTh7gVrb7A">
<style>
  :root { --ink:#0b1f2e; --paper:#fff; --pale:#a8bac7; --coral:#f09e90; }
  html,body { height:100%; }
  body {
    margin:0; background:var(--ink); color:var(--paper);
    font:400 17px/1.55 "Helvetica Neue",Helvetica,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  main { max-width:30rem; }
  .kick {
    color:var(--coral); font-weight:700; font-size:13px;
    letter-spacing:.14em; text-transform:uppercase; margin:0 0 14px;
  }
  h1 { font:700 28px/1.25 "Helvetica Neue",Helvetica,Arial,sans-serif;
       margin:0 0 12px; }
  p { color:var(--pale); margin:0 0 22px; }
  a.btn {
    display:inline-block; background:var(--paper); color:var(--ink);
    text-decoration:none; font-weight:700; padding:13px 22px; border-radius:2px;
  }
  a.btn:focus-visible { outline:3px solid var(--coral); outline-offset:3px; }
  .small { font-size:14px; margin-top:20px; }
  .small a { color:var(--coral); }
</style>
</head>
<body>
<main>
  <p class="kick">USMLE Step 1 &middot; January to July 2027</p>
  <h1>Taking you to the registration form.</h1>
  <p>If nothing happens in a moment, use the button.</p>
  <a class="btn" href="https://forms.gle/V3YRGfmHTh7gVrb7A">Open the form</a>
  <p class="small">Or message Allan on
    <a href="https://wa.me/256705571443">WhatsApp</a>.</p>
</main>
<script>
  // Replace rather than assign, so the back button returns the reader to
  // wherever they came from instead of bouncing them through here again.
  location.replace("https://forms.gle/V3YRGfmHTh7gVrb7A");
</script>
</body>
</html>
