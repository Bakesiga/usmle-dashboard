<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · USMLE Classes</title>
  <meta name="theme-color" content="#F6F1E7" />

  <!-- Add to Home Screen / installable web app -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="USMLE" />
  <meta name="application-name" content="USMLE" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Caprasimo + Figtree are @imported by css/redesign-tokens.css.
       This page loads exactly what dashboard.html loads, so signing in is not
       a jump between two different design systems. -->

  <link rel="stylesheet" href="css/redesign-tokens.css" />
  <link rel="stylesheet" href="css/site.css" />
  <style>
    /* The door into the dashboard, so it uses the dashboard's ground, type and
       accent. The previous version sat on a blue aurora with a cyan card rule
       and Instrument Serif, which made signing in feel like arriving at a
       different product. */
    body.signin-page {
      background: var(--bg);
      min-height: 100vh;
      display: grid; place-items: center;
      padding: 24px;
      font-family: var(--font-body);
      color: var(--ink);
      position: relative;
    }

    /* A single soft terracotta wash instead of the animated multi-hue aurora.
       Static: this screen is on-screen for seconds, and motion here competes
       with the one thing the page wants you to do. */
    body.signin-page::before {
      content: "";
      position: fixed; inset: 0;
      background:
        radial-gradient(60rem 34rem at 50% -10%, var(--accent-tint) 0%, transparent 62%),
        radial-gradient(44rem 30rem at 50% 110%, var(--sage-tint) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .signin-card {
      background: var(--bg-cream);
      border: 1px solid var(--border);
      border-top: 3px solid var(--accent);
      border-radius: 28px;
      padding: 40px 32px;
      max-width: 460px; width: 100%;
      box-shadow: 0 20px 60px rgba(32, 30, 29, 0.10);
      position: relative; z-index: 1;
    }
    .signin-card h1 {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: clamp(1.7rem, 3vw + 0.5rem, 2.3rem);
      line-height: 1.06;
      margin: 24px 0 12px;
      color: var(--ink);
    }
    .signin-card p {
      color: var(--ink-2);
      font-size: 15px; line-height: 1.55;
      margin: 0 0 8px;
    }
    .signin-help {
      font-size: 13px;
      letter-spacing: 0.01em;
      color: var(--muted);
      margin-top: 24px !important;
    }
    .signin-help a { color: var(--accent-deep); font-weight: 600; }

    /* The brand lockup matches the dashboard header. site.css still carries the
       old dark rounded square with a four-hue bar underneath; those four hues
       now all resolve to the same terracotta, so the bar renders as a solid
       stripe and the mark reads as a different logo from the one behind the
       login. These rules live here rather than in site.css because index.html
       is still on the old theme and shares that file. */
    .signin-card .brand-mark {
      width: 38px; height: 38px;
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-tint);
      font-family: var(--font-display);
      font-size: 19px;
      padding-top: 2px;
    }
    .signin-card .brand-mark::after { content: none; }
    .signin-card .brand > span:last-child {
      font-family: var(--font-body);
      font-size: 16px; font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--ink);
    }
    .signin-card .brand small { color: var(--muted); font-weight: 500; }
  </style>

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="signin-page" data-screen-label="02 Sign-in">
  <main class="signin-card">
    <a class="brand" href="index.html" aria-label="USMLE Classes home">
      <span class="brand-mark" aria-hidden="true">U</span>
      <span>USMLE Classes <small>· with Allan</small></span>
    </a>
    <h1>Sign in to access your dashboard.</h1>
    <p>The dashboard holds your daily Zoom link, slides, notes, and the cohort calendar. It's only open to enrolled students.</p>

    <!-- Real Google sign-in button renders here -->
    <div id="g-signin-container" style="display:flex; justify-content:center; margin: 1.5rem 0;"></div>

    <!-- Status / error feedback -->
    <p id="signin-status" role="status" aria-live="polite" style="min-height:1.5em; margin:0.5rem 0 0; font-size:0.95rem; color:#B45309;"></p>

    <p class="signin-help">
      Trouble signing in? <a href="mailto:allanbakesiga@gmail.com">Email Allan</a>.
    </p>
  </main>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    /* Bridge: when Google Identity Services finishes loading, initialize the
     * sign-in button and wire its callback to USMLE_AUTH.handleCredential. */
    (function () {
      var statusEl = document.getElementById("signin-status");
      var container = document.getElementById("g-signin-container");

      function showError(msg) {
        statusEl.textContent = msg;
        statusEl.style.color = "#B45309";
      }
      function showOK(msg) {
        statusEl.textContent = msg;
        statusEl.style.color = "#065F46";
      }

      /* Honor ?return=<url> if the URL is same-origin. Used by the artifact
       * gate so that a student bounced from outputs/study-notes/foo.html
       * lands back on foo.html after they sign in. */
      function safeReturnTarget() {
        try {
          var params = new URLSearchParams(window.location.search);
          var raw = params.get("return");
          if (!raw) return null;
          var target = new URL(raw, window.location.origin);
          if (target.origin !== window.location.origin) return null;
          return target.href;
        } catch (e) {
          return null;
        }
      }

      function landingTarget() {
        return safeReturnTarget() || "dashboard.html";
      }

      function onCredential(response) {
        if (!response || !response.credential) {
          showError("Sign-in cancelled. Try again.");
          return;
        }
        // Ensure the allowlist is fetched before we check the credential.
        USMLE_AUTH.loadAllowlist().then(function () {
          var result = USMLE_AUTH.handleCredential(response.credential);
          if (!result.ok) {
            showError(result.error);
            return;
          }
          showOK("Signed in. Loading your dashboard…");
          var dest = landingTarget();
          setTimeout(function () { location.replace(dest); }, 400);
        });
      }

      function init() {
        if (!window.google || !google.accounts || !google.accounts.id) {
          setTimeout(init, 100);
          return;
        }
        google.accounts.id.initialize({
          client_id: USMLE_CONFIG.GOOGLE_CLIENT_ID,
          callback: onCredential,
          auto_select: false,
          cancel_on_tap_outside: true,
        });
        google.accounts.id.renderButton(container, {
          type: "standard",
          theme: "filled_blue",
          size: "large",
          text: "continue_with",
          shape: "pill",
          logo_alignment: "left",
          width: 280,
        });
      }

      // If already signed in, skip straight to the dashboard (or the
      // requested return target).
      var existing = USMLE_AUTH.getSession();
      if (existing) {
        location.replace(landingTarget());
      } else {
        init();
      }
    })();
  </script>

  <script src="js/tweaks.js"></script>
</body>
</html>
